services:
  api:
    build: .
    container_name: stocksense-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://stocksense:localpass@db:5432/stocksense
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: stocksense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: localpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/db/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: stocksense-mail
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP — used by backend to send OTP emails
      - "8025:8025"    # Web UI — view  to send emails at http://localhost:8025

volumes:
  pgdata:
    driver: local
